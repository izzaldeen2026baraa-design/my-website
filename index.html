<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سجل زبونات الرموش - براء عباس</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #fff0f5;
  color: #4a1935;
  padding: 20px;
  margin: 0;
}
.container {
  max-width: 500px;
  margin: auto;
  background: white;
  padding: 22px;
  border-radius: 18px;
  box-shadow: 0 4px 15px #d8a3bb;
}
h1 {
  text-align: center;
  color: #b83280;
  font-size: 25px;
}
label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}
input, select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #e4b5cd;
  border-radius: 9px;
  font-size: 16px;
}
button {
  width: 100%;
  margin-top: 18px;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #b83280;
  color: white;
  font-size: 17px;
}
.entry {
  background: #fff0f5;
  padding: 12px;
  margin-top: 12px;
  border-radius: 10px;
  overflow-wrap: anywhere;
}
.delete {
  background: #8c294f;
}
</style>
</head>
<body>
<div class="container">
  <h1>براء عباس</h1>
  <h2 style="text-align:center">سجل زبونات الرموش 💗</h2>
  <form id="customerForm">
    <label>الاسم الكامل</label>
    <input id="fullName" required placeholder="اكتبي اسم الزبونة">
    <label>تاريخ الزيارة</label>
    <input id="visitDate" type="date" required>
    <label>نوع الرموش المستخدمة</label>
    <select id="lashType" required>
      <option value="">اختاري نوع الرموش</option>
      <option>كلاسيك</option>
      <option>فوليوم</option>
      <option>ميغا فوليوم</option>
      <option>هايبرد</option>
      <option>رموش وايسبي</option>
      <option>رفع رموش</option>
      <option>نوع آخر</option>
    </select>
    <label>رقم الهاتف</label>
    <input id="phone" type="tel" required placeholder="رقم هاتف الزبونة">
    <label>المبلغ (دينار عراقي)</label>
    <input id="amount" type="number" min="0" required placeholder="المبلغ">
    <button type="submit">حفظ بيانات الزبونة</button>
  </form>
  <h2>الزيارات المسجلة</h2>
  <div id="records"></div>
</div>
<script>
const form = document.getElementById("customerForm");
const records = document.getElementById("records");
let customers = JSON.parse(
  localStorage.getItem("baraaCustomers") || "[]"
);
function renderRecords() {
  records.innerHTML = "";
  customers.forEach((customer, index) => {
    const entry = document.createElement("div");
    entry.className = "entry";
    const details = document.createElement("p");
    details.textContent =
      "الاسم: " + customer.name +
      " | تاريخ الزيارة: " + customer.date +
      " | نوع الرموش: " + customer.lashes +
      " | الهاتف: " + customer.phone +
      " | المبلغ: " + customer.amount + " دينار";
    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "حذف السجل";
    deleteButton.onclick = () => {
      if (confirm("متأكدة تريدين حذف هذا السجل؟")) {
        customers.splice(index, 1);
        saveRecords();
      }
    };
    entry.append(details, deleteButton);
    records.appendChild(entry);
  });
}
function saveRecords() {
  localStorage.setItem("baraaCustomers", JSON.stringify(customers));
  renderRecords();
}
form.addEventListener("submit", function(event) {
  event.preventDefault();
  customers.push({
    name: document.getElementById("fullName").value.trim(),
    date: document.getElementById("visitDate").value,
    lashes: document.getElementById("lashType").value,
    phone: document.getElementById("phone").value.trim(),
    amount: document.getElementById("amount").value
  });
  saveRecords();
  form.reset();
  alert("تم حفظ بيانات الزبونة 💗");
});
renderRecords();
</script>
</body>
</html>
